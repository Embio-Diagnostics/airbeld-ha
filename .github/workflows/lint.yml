name: CI
on:
  push:
    branches: [main, smart-home-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: [newest, floor]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: |
            3.13
            3.14
      - name: Install tooling
        run: |
          python -m pip install uv==0.9.5
          sudo apt-get update
          sudo apt-get install -y just
      - name: Cache locked environments and validator
        run: |
          uv sync --frozen
          uv sync --frozen --project ci/ha-min
          docker pull ghcr.io/home-assistant/hassfest@sha256:4b1adfb1e0a37710af0390708eb8000230b80b2193ccffbeed0a901fa9765181
      - name: Run shared gate
        env:
          HA_SELECT: ${{ matrix.ha }}
        run: just ci
